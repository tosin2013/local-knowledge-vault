# Coverage gates for pull requests. `npm run coverage` merges two suites into one lcov
# (scripts/merge-coverage.mjs): c8 over the offline smoke tests in scripts/ (electron/**) and vitest over
# tests/renderer (src/**); see docs/adr/0001. .github/workflows/ci.yml uploads it.
#
# Goals: main process (electron/) >= 80% lines (v0.2.x, #83); whole project >= 80% (v0.4.0, #89).
# The project status and the renderer component status each block drops of more than 1% vs the base
# commit; the main-process component is reported (not yet gated; that is #83).
codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "40...80"
  status:
    project:
      default:
        # No regressions: total coverage may not drop more than 1% below the base commit.
        target: auto
        threshold: 1%
    patch:
      default:
        # Lines added or changed by a PR must be tested.
        target: 70%

component_management:
  individual_components:
    - component_id: main-process
      name: main process
      paths:
        - electron/**
    - component_id: renderer
      name: renderer
      paths:
        - src/**
      statuses:
        - type: project
          # Blocking since #85: renderer tests mount <App /> and every src/ file is measured (#96).
          target: auto
          threshold: 1%

ignore:
  - "electron/types.ts"
  - "scripts/**"

comment:
  layout: "diff, components, files"
