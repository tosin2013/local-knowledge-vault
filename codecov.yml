# Coverage gates for pull requests. `npm run coverage` merges two suites into one lcov
# (scripts/merge-coverage.mjs): c8 over the offline smoke tests in scripts/ (electron/**) and vitest over
# tests/renderer (src/**); see docs/adr/0001. .github/workflows/ci.yml uploads it.
#
# Goals: main process (electron/) >= 80% lines (gated since #83); whole project >= 80% (gated since #89).
# The project status and both component statuses enforce their floors; patch
# coverage keeps new lines tested.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "40...80"
  status:
    project:
      default:
        # Fixed floor since #89: total coverage must stay at or above 80%.
        target: 80%
    patch:
      default:
        # Lines added or changed by a PR must be tested.
        target: 70%

component_management:
  individual_components:
    - component_id: main-process
      name: main process
      paths:
        - electron/**
      statuses:
        - type: project
          # Gated since #83: electron/ must stay at or above 80% lines
          # (mirrored locally by `npm run coverage:main`).
          target: 80%
    - component_id: renderer
      name: renderer
      paths:
        - src/**
      statuses:
        - type: project
          # Fixed floor since #89: renderer must stay at or above 70% lines.
          target: 70%

ignore:
  - "electron/types.ts"
  - "scripts/**"

comment:
  layout: "diff, components, files"
