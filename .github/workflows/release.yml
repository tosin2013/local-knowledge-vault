name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: npm run build && npx electron-builder --mac --arm64 --x64 --publish never
          - os: windows-latest
            dist: npm run dist:win
          - os: ubuntu-latest
            dist: npm run dist:linux
    env:
      # Unsigned builds for now; see README for the macOS "Open Anyway" steps.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # rpmbuild for the .rpm target; snapcraft for the .snap target.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo snap install snapcraft --classic

      # better-sqlite3 is native, so each OS builds its own copy (postinstall → install-app-deps).
      - run: npm ci

      - name: Build installers
        run: ${{ matrix.dist }}
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: vault-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.snap

  snap:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # Created with `snapcraft export-login`; until this secret exists the upload is skipped.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/download-artifact@v8
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          name: vault-ubuntu-latest
          path: linux

      # Lands in the edge channel; promote to stable on snapcraft.io after trying it.
      - name: Upload to Snap Store (edge)
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload --release=edge linux/*.snap

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist-artifacts/*
          generate_release_notes: true
