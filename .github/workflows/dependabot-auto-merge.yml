name: Dependabot auto-merge

# Minor and patch updates merge automatically once the required CI check passes.
# Major updates are labeled and left for manual review and approval.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major updates for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh label create major-update --color B60205 --description "Major version bump: review manually" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label major-update
          gh pr comment "$PR_URL" --body "Major version update (${{ steps.meta.outputs.dependency-names }}): not auto-merged. Review the changelog, check CI, then approve and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
