name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall runs electron-builder install-app-deps, rebuilding better-sqlite3 for Electron.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run build

      # Offline smoke tests. They run under ELECTRON_RUN_AS_NODE=1, so no display is needed.
      - run: npm run test:mvp
      - run: npm run test:providers
      - run: npm run test:media
      - run: npm run test:citation-pack
