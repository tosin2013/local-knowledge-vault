name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall runs electron-builder install-app-deps, rebuilding better-sqlite3 for Electron.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run build

      # Both suites, offline: the Electron smoke tests (test:ci, under c8 with ELECTRON_RUN_AS_NODE=1, so no
      # display is needed), then the renderer Vitest suite; the two lcov reports are merged for Codecov.
      - run: npm run coverage

      # Main-process gate (#83): electron/ must stay at or above 80% lines.
      - run: npm run coverage:main

      # Fork PRs have no CODECOV_TOKEN; the upload failing must not fail CI.
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          # Upload only lcov.info, not c8's raw V8 dumps in coverage/tmp/.
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
